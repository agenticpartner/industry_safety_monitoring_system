  1:
    zones:
      - name: AisleLeft
        kind: roi
        severity: medium
        points: [[0.039, 1.00], [0.224, 0.139], [0.344, 0.139], [0.383, 1.00]]
      - name: AisleRight
        kind: roi
        severity: medium
        points: [[0.521, 1.00], [0.510, 0.139], [0.688, 0.139], [0.938, 1.00]]
      - name: VehicleZone
        kind: restricted
        severity: high
        points: [[0.510, 0.00], [0.700, 0.00], [0.700, 0.185], [0.510, 0.185]]
      - name: AisleLeftOC
