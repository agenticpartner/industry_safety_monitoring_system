# Zone definitions for nvdsanalytics. Source of truth — `configs/analytics/analytics.txt` is
# GENERATED from this by `scripts/make_zones.py --generate`.
#
# Coordinates are NORMALISED (0..1, origin top-left), so they survive a resolution change and can
# be checked by eye against a preview render:
#
#     python3 scripts/make_zones.py --preview 1 2      # build/zone_preview/camNN.jpg
#     python3 scripts/make_zones.py --generate
#
# The 20 demo clips come from only 16 distinct source views (12 in mtmc_12cam + 4 in mtmc_4cam);
# cam17-20 repeat the views of cam01-04 with a +3s offset, so they use `same_as` rather than
# duplicated coordinates that would drift apart when edited.
#
# `kind`:
#   roi          ordinary walkway. Presence recorded on the event, severity unchanged.
#   restricted   vehicle / hazard area. A PPE violation HERE is escalated — this is the whole
#                point of the phase: "no helmet in the forklift aisle" is not the same finding
#                as "no helmet in a corridor".
#   overcrowding occupancy limit; fires when more than `threshold` objects are inside.
#   line         crossing counter. Four points: TWO for the direction vector, then TWO for the
#                line being crossed. Reversing them counts crossings the wrong way.
#
# `severity` is product meaning, read by app/safety_pipeline.py — nvdsanalytics never sees it.

config_width: 1920
config_height: 1080
osd_mode: 1              # 1 = draw zone outlines; 2 adds text that is unreadable on a 20-tile wall
display_font_size: 10
preview_seek: 12         # seconds into the clip to grab the preview frame

cameras:
