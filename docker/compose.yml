# x86_64 dGPU deployment.
#
#   docker compose -f docker/compose.yml up --build -d
#   docker compose -f docker/compose.yml logs -f app
#   docker compose -f docker/compose.yml down
#
# Then http://<host>:8080/
#
# `network_mode: host` throughout, which is a decision rather than a shortcut: configs/services.yml
# addresses redis at 127.0.0.1:6379 and the pipeline publishes to rtsp://127.0.0.1:8554, and those
# files are the Jetson's too. Bridge networking would mean editing shared config to carry a
# container-only hostname. Host networking keeps one set of configs correct on both platforms, and
# on a single-purpose GPU appliance there is nothing to isolate it from.

name: isms

services:

  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    # The event bus between the pipeline and the services. Persistence is off on purpose: the
    # stream is bounded to 100k entries (services.yml) and SQLite is the durable store — an RDB
    # dump would duplicate it and stall the writer at exactly the wrong moment.
    #
    # `--bind 127.0.0.1` is not optional. With host networking there is one port space and it is
    # the machine's, so a default-bound redis on a cloud instance is an unauthenticated redis on a
    # public IP — verified answering PING from the open internet on this very deployment. That is
    # a known, automated attack path: CONFIG SET dir/dbfilename turns it into arbitrary file write
    # as the redis user. Nothing outside this host has any reason to reach the event bus.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--bind", "127.0.0.1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: isms:x86
    network_mode: host
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    gpus: all

    environment:
      ISMS_STREAMS: "${ISMS_STREAMS:-20}"
      ISMS_SOURCE: "${ISMS_SOURCE:-file}"
      ISMS_AUTOSTART: "${ISMS_AUTOSTART:-1}"
      ISMS_WIPE: "${ISMS_WIPE:-1}"
      ISMS_ENGINE_BATCH: "${ISMS_ENGINE_BATCH:-20}"
      # How long to keep watching for the VLM before giving up and running vision-only. The wait
      # happens in the background, so it never delays the pipeline or the dashboard.
      ISMS_WAIT_VLM_S: "${ISMS_WAIT_VLM_S:-2400}"
      # Camera addresses come from the environment, never from the committed config: real URLs
      # carry credentials, and the same image runs against a different fleet at every site.
      # Subject crops. Unset lets the API follow the source mode: on for rtsp, off for file.
      ISMS_RGB_CAPTURE: "${ISMS_RGB_CAPTURE:-}"
      ISMS_RTSP_BASE: "${ISMS_RTSP_BASE:-}"
      ISMS_RTSP_URLS: "${ISMS_RTSP_URLS:-}"

    volumes:
      # Footage. Read-only: the pipeline decodes it and clip_service cuts from it with
      # `ffmpeg -c copy`, and neither has any reason to write back.
      - ../media:/opt/isms/media:ro
      # Engines live here. A named volume so the ~10 minute build survives a container replace;
      # the entrypoint stamps them with the GPU that built them and rebuilds on a mismatch.
      - models:/opt/isms/models
      # Incident database and evidence clips.
      - data:/opt/isms/data
      - logs:/opt/isms/logs

    # DeepStream's buffer pools live in shared memory; the 64 MB default is not enough for twenty
    # 1080p streams through a muxer, a tiler and an OSD.
    shm_size: "2gb"
    ulimits:
      memlock: -1
      stack: 67108864

  # ---------------------------------------------------------------------------------------------
  # Reasoning layer
  # ---------------------------------------------------------------------------------------------
  # Two containers, one image. The VLM adjudicates every incident, so it must be cheap; the agent
  # LLM answers human questions, so it can be bigger. Different duty cycles, and restarting one
  # must never disturb the other.
  #
  # Nothing waits on these. They pull ~12 GB of weights on first boot and take minutes to load,
  # and the vision path is not allowed to be hostage to that: the app starts immediately and joins
  # the reasoning layer when it appears. Until then incidents stay `unverified`, which is the
  # documented degraded mode, not a failure.

  vlm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.llama
      args:
        CUDA_ARCHS: "${CUDA_ARCHS:-80;86;89;90}"
    image: isms-llama:x86
    network_mode: host
    restart: unless-stopped
    gpus: all
    environment:
      ROLE: vlm
      PORT: "8000"
      # Loopback: only the app container, which shares this host's network namespace, calls it.
      LLAMA_HOST: "${LLAMA_HOST:-127.0.0.1}"
      # Only needed if a weights repo is gated. Read from docker/.env or the shell.
      HF_TOKEN: "${HF_TOKEN:-}"
      LLAMA_CTX_SIZE: "${VLM_CTX_SIZE:-8192}"
    volumes:
      - weights:/weights
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/v1/models || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 60
      # Generous: the first boot downloads ~7 GB before the server can answer anything.
      start_period: 30m

  llm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.llama
      args:
        CUDA_ARCHS: "${CUDA_ARCHS:-80;86;89;90}"
    image: isms-llama:x86
    network_mode: host
    restart: unless-stopped
    gpus: all
    environment:
      ROLE: llm
      PORT: "8001"
      # Loopback: only the app container, which shares this host's network namespace, calls it.
      LLAMA_HOST: "${LLAMA_HOST:-127.0.0.1}"
      HF_TOKEN: "${HF_TOKEN:-}"
      LLAMA_CTX_SIZE: "${LLM_CTX_SIZE:-8192}"
    volumes:
      - weights:/weights
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8001/v1/models || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 60
      start_period: 30m

  # ---------------------------------------------------------------------------------------------
  # RTSP camera farm — a TEST RIG, not part of a deployment
  # ---------------------------------------------------------------------------------------------
  # Behind a profile, so it never starts by accident:
  #
  #     docker compose -f docker/compose.yml --profile sources up -d
  #     ISMS_SOURCE=rtsp ISMS_RTSP_BASE=rtsp://127.0.0.1:8654 \
  #       docker compose -f docker/compose.yml up -d app
  #
  # In production the cameras ARE separate devices and this does not exist; scripts/
  # serve_rtsp_sources.sh says so in its own header, and running the restreamers beside the
  # inference they feed is exactly what it warns against. It is here because the RTSP ingest path
  # — reconnection, TCP transport, and smart-record evidence clips — is otherwise untestable on a
  # single cloud instance, and those are behaviours, not throughput.
  #
  # Any fps measured with this running describes a box doing both jobs and is not comparable to a
  # figure taken against cameras on a network.
  #
  # Port 8654, not 8554: the app's own mediamtx holds 8554 for the tiled output, and with host
  # networking there is one port space.
  sources:
    profiles: ["sources"]
    image: isms:x86
    network_mode: host
    restart: unless-stopped
    environment:
      RTSP_PORT: "8654"
      # Same box as the pipeline, so there is nothing off-host to serve.
      RTSP_BIND: "127.0.0.1"
    volumes:
      - ../media:/opt/isms/media:ro
    # The script backgrounds mediamtx and the restreamers and returns; the tail is what gives the
    # container something to be.
    command:
      - bash
      - -c
      - "scripts/serve_rtsp_sources.sh start ${ISMS_STREAMS:-20} && tail -f build/mediamtx-sources.log"

volumes:
  models:
  data:
  logs:
  # ~12 GB of GGUF between the two models. A volume rather than image layers so the image stays
  # portable and a redeploy does not re-pull them.
  weights:
